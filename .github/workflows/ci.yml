name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

# Only the latest run per branch/PR matters: cancel older in-progress ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libglib2.0-dev libwebkit2gtk-4.1-dev librsvg2-dev pkg-config
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml --features test-server
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in frontend/*.js; do node --check "$f"; done
      - run: for f in frontend/app-modules/*.js; do node --check "$f"; done
      - run: for f in frontend/galaxyview/*.js; do node --check "$f"; done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx eslint frontend/ frontend/app-modules/ frontend/galaxyview/

  test:
    needs: [rust, js, lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config xvfb
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Build Tauri app (test-server)
        shell: bash
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --features test-server
      - name: Install built app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            if compgen -G "src-tauri/target/release/bundle/deb/*.deb" > /dev/null; then
              sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
            fi
          elif [ "$RUNNER_OS" = "macOS" ]; then
            mkdir -p "$HOME/Applications"
            if [ -d "src-tauri/target/release/bundle/macos/DiskRaptor.app" ]; then
              cp -R "src-tauri/target/release/bundle/macos/DiskRaptor.app" "$HOME/Applications/"
            elif [ -d "dist/DiskRaptor.app" ]; then
              cp -R "dist/DiskRaptor.app" "$HOME/Applications/"
            fi
          else
            mkdir -p "$LOCALAPPDATA\\DiskRaptor"
            if [ -f "src-tauri/target/release/diskraptor.exe" ]; then
              cp "src-tauri/target/release/diskraptor.exe" "$LOCALAPPDATA\\DiskRaptor\\"
            fi
          fi
      - name: Run UI tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a dbus-run-session -- env WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_FORCE_SANDBOX=0 NO_AT_BRIDGE=1 GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 bash test.sh --quick
      - name: Run UI tests (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash test.sh --quick
      - name: Run UI tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmd /c test.bat --quick

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - name: Build Tauri app
        run: ./build.sh
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          # Only the real build bundles â€” NOT dist/** which contains frontend
          # sources/images and would flood the release with junk assets.
          files: |
            src-tauri/target/release/bundle/**/*
