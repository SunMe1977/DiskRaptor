name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the latest run per branch/PR matters: cancel older in-progress ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-frontend.mjs
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      # Shared compilation cache across jobs/runs (big win: the 3-OS matrix
      # below reuses the dependency build instead of recompiling everything).
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libglib2.0-dev libwebkit2gtk-4.1-dev librsvg2-dev pkg-config
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --manifest-path src-tauri/Cargo.toml --profile ci
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
      - run: cargo check --manifest-path src-tauri/Cargo.toml
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
      - run: cargo check --manifest-path src-tauri/Cargo.toml --features test-server
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
      # The FFI module (scanner_api) and benches/examples are feature-gated;
      # lint them too so cfg(ffi) code can't rot silently.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features ffi -- -D warnings
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: for f in frontend/*.js; do node --check "$f"; done
      - run: for f in frontend/app-modules/*.js; do node --check "$f"; done
      - run: for f in frontend/galaxyview/*.js; do node --check "$f"; done
      - run: for f in frontend/i18n/*.js; do node --check "$f"; done
      - run: for f in tests/*.mjs; do node --check "$f"; done
      - run: for f in scripts/*.mjs; do node --check "$f"; done
      - name: Version consistency
        run: node scripts/check-version.mjs
      - name: Frontend perf budget
        run: npm ci --no-audit --no-fund && node scripts/build-frontend.mjs && node scripts/check-budget.mjs
      - name: IPC contract self-test
        run: node tests/contract_self_test.mjs
      - name: i18n hardcoded string audit
        run: node scripts/i18n-hardcoded-audit.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx eslint frontend/ frontend/app-modules/ frontend/galaxyview/ frontend/i18n/ tests/ scripts/

  test:
    needs: [rust, js, lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev pkg-config xvfb
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
      # NOTE: Rust unit tests + clippy run once on ubuntu in the `rust` job
      # (cargo nextest, sccache-backed). This matrix validates the release
      # build and the UI suite on each OS — it intentionally does not repeat
      # `cargo test` per platform. One exception: Windows-only clippy, so
      # `cfg(windows)` code (unreachable on ubuntu) stays lint-clean.
      # NOTE: frontend-dist must exist before any Rust compile step: the
      # generate_context!() proc macro panics when the configured
      # frontendDist path is missing (frontend-dist/ is gitignored).
      - name: Build minified frontend (frontend-dist)
        run: node scripts/build-frontend.mjs
      - name: Clippy (Windows-only code)
        if: runner.os == 'Windows'
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build Tauri app (test-server)
        shell: bash
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --features test-server
      - name: Install built app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            if compgen -G "src-tauri/target/release/bundle/deb/*.deb" > /dev/null; then
              sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
            fi
          elif [ "$RUNNER_OS" = "macOS" ]; then
            mkdir -p "$HOME/Applications"
            if [ -d "src-tauri/target/release/bundle/macos/DiskRaptor.app" ]; then
              cp -R "src-tauri/target/release/bundle/macos/DiskRaptor.app" "$HOME/Applications/"
            elif [ -d "dist/DiskRaptor.app" ]; then
              cp -R "dist/DiskRaptor.app" "$HOME/Applications/"
            fi
          else
            mkdir -p "$LOCALAPPDATA\\DiskRaptor"
            if [ -f "src-tauri/target/release/diskraptor.exe" ]; then
              cp "src-tauri/target/release/diskraptor.exe" "$LOCALAPPDATA\\DiskRaptor\\"
            fi
          fi
      - name: Run UI tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a dbus-run-session -- env WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_FORCE_SANDBOX=0 NO_AT_BRIDGE=1 GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 bash test.sh --quick
      - name: Run UI tests (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash test.sh --quick
      - name: Run UI tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmd /c test.bat --quick
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            *.log
            out.log
            err.log
            stdout.log
            stderr.log

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: npm audit (JS dependencies)
        run: npm audit --audit-level=high
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit (security advisories)
        working-directory: src-tauri
        run: cargo audit
      - name: cargo deny (licenses, bans, sources)
        run: cargo deny --manifest-path src-tauri/Cargo.toml check
