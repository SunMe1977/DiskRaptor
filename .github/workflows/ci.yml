name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: for f in frontend/*.js; do node --check "$f"; done
      - run: for f in frontend/app-modules/*.js; do node --check "$f"; done
      - run: for f in frontend/galaxyview/*.js; do node --check "$f"; done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx eslint frontend/ frontend/app-modules/ frontend/galaxyview/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [rust, js, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install Qt6 + build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-webengine-dev qt6-webchannel-dev \
            libgl1-mesa-dev ninja-build cmake dpkg-dev
      - name: Build Rust scanner
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Build Qt app
        run: |
          cmake -B qt-app/build -G Ninja -DCMAKE_BUILD_TYPE=Release qt-app
          cmake --build qt-app/build --config Release
      - name: Stage dist
        run: |
          mkdir -p dist/frontend dist/images
          cp qt-app/build/DiskRaptor dist/
          cp qt-app/build/*.dll dist/ 2>/dev/null || true
          cp -r frontend/* dist/frontend/
          cp -r images/* dist/images/
      - name: Package .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./build.sh --deb-only
      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
