name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libglib2.0-dev pkg-config
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in frontend/*.js; do node --check "$f"; done
      - run: for f in frontend/app-modules/*.js; do node --check "$f"; done
      - run: for f in frontend/galaxyview/*.js; do node --check "$f"; done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx eslint frontend/ frontend/app-modules/ frontend/galaxyview/

  test:
    needs: [rust, js, lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config xvfb
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - name: Build Tauri app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd /c build.cmd
          else
            ./build.sh
          fi
      - name: Run UI tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a bash test.sh
      - name: Run UI tests (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash test.sh
      - name: Run UI tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmd /c test.bat
