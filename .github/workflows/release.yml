name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Only the latest run per ref: cancel older in-progress ones.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64 (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: Build Tauri NSIS installer
        run: npx tauri build --bundles nsis --ci
      - name: Stage release assets
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "src-tauri\target\release\diskraptor.exe" "release-assets\DiskRaptor.exe" -Force
          Copy-Item "src-tauri\target\release\bundle\nsis\DiskRaptor_${ver}_x64-setup.exe" "release-assets\DiskRaptor-${ver}-windows-x64.exe" -Force
          Write-Host "=== Staged assets ==="
          Get-ChildItem release-assets | Select-Object Name, Length
          if (-not (Test-Path "release-assets\DiskRaptor-${ver}-windows-x64.exe")) {
            Write-Error "NSIS installer not found (DiskRaptor_${ver}_x64-setup.exe)"
            exit 1
          }
      # Signing comes later (Azure Trusted Signing / code-signing cert).
      # Add a signtool / trusted-signing step here before Deploy.
      - name: Deploy to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v') { $tag = "v" + (Get-Content package.json | ConvertFrom-Json).version }
          Write-Host "Target release: $tag"
          gh release create $tag --title "DiskRaptor $tag" --notes "" 2>$null
          gh release upload $tag "release-assets/*" --clobber
          gh release view $tag --json assets --jq '[.assets[] | {name, size}]'

  macos-universal:
    name: macOS Universal (Tauri)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: Add macOS universal targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build Tauri app bundle (universal, unsigned)
        run: npx tauri build --bundles app --ci --target universal-apple-darwin
      - name: Setup code signing keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$MACOS_CERT_P12" | base64 --decode > /tmp/mas_certs.p12
          security create-keychain -p ci /tmp/ci.keychain
          security default-keychain -s /tmp/ci.keychain
          security unlock-keychain -p ci /tmp/ci.keychain
          security set-keychain-settings -t 3600 /tmp/ci.keychain
          security import /tmp/mas_certs.p12 -P "$MACOS_CERT_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k ci /tmp/ci.keychain
          security list-keychains -d user -s /tmp/ci.keychain
          rm -f /tmp/mas_certs.p12
          security find-identity -v -p codesigning /tmp/ci.keychain
      - name: Codesign macOS app
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/DiskRaptor.app"
          [ -d "$APP" ] || { echo "App bundle not found: $APP"; exit 1; }
          xattr -cr "$APP" || true
          plutil -replace CFBundleIdentifier -string "$BUNDLE_ID" "$APP/Contents/Info.plist"
          find "$APP/Contents" -type f -name "*.dylib" -print0 | \
            xargs -0 -P4 -I{} codesign --force --options=runtime --sign "$SIGNING_IDENTITY" "{}" || true
          find "$APP/Contents" -type d -name "*.framework" -print0 | \
            xargs -0 -P4 -I{} codesign --force --options=runtime --sign "$SIGNING_IDENTITY" "{}" || true
          codesign --force --options=runtime --entitlements installer/DiskRaptor.entitlements \
            --sign "$SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Stage and create DMG
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/DiskRaptor.app"
          mkdir -p release-assets dmg-staging
          cp -R "$APP" "release-assets/DiskRaptor-${ver}-macos.app"
          cp -R "$APP" "dmg-staging/DiskRaptor.app"
          ln -s /Applications "dmg-staging/Applications"
          hdiutil create -volname "DiskRaptor" -srcfolder dmg-staging -ov -format UDZO \
            "release-assets/DiskRaptor-${ver}-macos-universal.dmg"
          rm -rf dmg-staging
          ls -la release-assets
      # Notarization requires a "Developer ID Application" certificate. The current
      # MAS cert may be rejected; continue-on-error ships the signed DMG regardless.
      - name: Notarize and staple
        continue-on-error: true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          dmg="release-assets/DiskRaptor-${ver}-macos-universal.dmg"
          app="release-assets/DiskRaptor-${ver}-macos.app"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler staple "$app"
          xcrun stapler validate "$dmg" "$app"
      - name: Deploy to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if [[ "$tag" != v* ]]; then tag="v$(node -p "require('./package.json').version")"; fi
          gh release create "$tag" --title "DiskRaptor $tag" --notes "" 2>/dev/null || true
          gh release upload "$tag" "release-assets/*" --clobber
          gh release view "$tag" --json assets --jq '[.assets[] | {name, size}]'
