name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Only the latest run per ref: cancel older in-progress ones.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64 (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: Build normal installers (NSIS + MSI)
        run: npx tauri build --bundles nsis,msi --ci
      - name: Stage normal MSI
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          # The silent build later overwrites this MSI path, so preserve the
          # normal (interactive) MSI here under its release name.
          Copy-Item "src-tauri\target\release\bundle\msi\DiskRaptor_${ver}_x64_en-US.msi" "release-assets\DiskRaptor-${ver}-windows-x64.msi" -Force
          if (-not (Test-Path "release-assets\DiskRaptor-${ver}-windows-x64.msi")) {
            Write-Error "MSI installer not found (DiskRaptor_${ver}_x64_en-US.msi)"
            exit 1
          }
      - name: Build silent MSI (for Microsoft Store)
        run: npx tauri build --bundles msi --config src-tauri/tauri.silent.conf.json --ci
      - name: Build silent installer EXE (for Microsoft Store)
        shell: pwsh
        run: |
          # makensis comes from the NSIS that the Tauri bundler already downloaded.
          # The WebView2 Evergreen Standalone is downloaded and embedded, so the
          # install never needs network access.
          powershell -ExecutionPolicy Bypass -File installer\nsis\build-silent.ps1
      - name: Stage release assets
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          # Portable executable (no installer UI) — direct-run portable EXE.
          Copy-Item "src-tauri\target\release\diskraptor.exe" "release-assets\DiskRaptor.exe" -Force
          # NSIS setup installer.
          Copy-Item "src-tauri\target\release\bundle\nsis\DiskRaptor_${ver}_x64-setup.exe" "release-assets\DiskRaptor-${ver}-windows-x64.exe" -Force
          # Fully silent installer EXE for the Microsoft Store (built above).
          # After the silent build, this MSI is the UI-less variant.
          Copy-Item "src-tauri\target\release\bundle\msi\DiskRaptor_${ver}_x64_en-US.msi" "release-assets\DiskRaptor-${ver}-windows-x64-silent.msi" -Force
          Write-Host "=== Staged assets ==="
          Get-ChildItem release-assets | Select-Object Name, Length
          if (-not (Test-Path "release-assets\DiskRaptor-${ver}-windows-x64.exe")) {
            Write-Error "NSIS installer not found (DiskRaptor_${ver}_x64-setup.exe)"
            exit 1
          }
          if (-not (Test-Path "release-assets\DiskRaptor-${ver}-windows-x64-silent.exe")) {
            Write-Error "Silent installer EXE not found"
            exit 1
          }
          if (-not (Test-Path "release-assets\DiskRaptor-${ver}-windows-x64-silent.msi")) {
            Write-Error "Silent MSI not found"
            exit 1
          }
      # Signing comes later (Azure Trusted Signing / code-signing cert).
      - name: Deploy to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v') { $tag = "v" + (Get-Content package.json | ConvertFrom-Json).version }
          Write-Host "Target release: $tag"
          gh release create $tag --title "DiskRaptor $tag" --generate-notes 2>$null
          gh release upload $tag "release-assets/*" --clobber
          gh release view $tag --json assets --jq '[.assets[] | {name, size}]'

  macos-universal:
    name: macOS Universal (Tauri)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: Add macOS universal targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build Tauri app bundle (universal, unsigned)
        run: npx tauri build --bundles app --ci --target universal-apple-darwin
      - name: Setup code signing keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$MACOS_CERT_P12" | base64 --decode > /tmp/mas_certs.p12
          security create-keychain -p ci /tmp/ci.keychain
          security default-keychain -s /tmp/ci.keychain
          security unlock-keychain -p ci /tmp/ci.keychain
          security set-keychain-settings -t 3600 /tmp/ci.keychain
          security import /tmp/mas_certs.p12 -P "$MACOS_CERT_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k ci /tmp/ci.keychain
          security list-keychains -d user -s /tmp/ci.keychain
          rm -f /tmp/mas_certs.p12
          security find-identity -v -p codesigning /tmp/ci.keychain
      - name: Codesign macOS app
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/DiskRaptor.app"
          [ -d "$APP" ] || { echo "App bundle not found: $APP"; exit 1; }
          xattr -cr "$APP" || true
          plutil -replace CFBundleIdentifier -string "$BUNDLE_ID" "$APP/Contents/Info.plist"
          find "$APP/Contents" -type f -name "*.dylib" -print0 | \
            xargs -0 -P4 -I{} codesign --force --options=runtime --sign "$SIGNING_IDENTITY" "{}" || true
          find "$APP/Contents" -type d -name "*.framework" -print0 | \
            xargs -0 -P4 -I{} codesign --force --options=runtime --sign "$SIGNING_IDENTITY" "{}" || true
          codesign --force --options=runtime --entitlements installer/DiskRaptor.entitlements \
            --sign "$SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Stage and create DMG + PKG
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/DiskRaptor.app"
          # The .app is a directory â€” keep it OUT of release-assets (gh release
          # upload only accepts files). Ship the DMG + PKG as release assets.
          mkdir -p release-assets macos-app dmg-staging
          cp -R "$APP" "macos-app/DiskRaptor-${ver}-macos.app"
          cp -R "$APP" "dmg-staging/DiskRaptor.app"
          ln -s /Applications "dmg-staging/Applications"
          hdiutil create -volname "DiskRaptor" -srcfolder dmg-staging -ov -format UDZO \
            "release-assets/DiskRaptor-${ver}-macos-universal.dmg"
          rm -rf dmg-staging
          # macOS .pkg installer (the .deb equivalent) for direct distribution.
          PKG="release-assets/DiskRaptor-${ver}-macos-universal.pkg"
          INSTALLER_CERT="$(security find-identity -v -p basic 2>/dev/null | grep -i 'Developer ID Installer' | head -1 | sed 's/.*"\([^"]*\)".*/\1/' || true)"
          if [ -n "$INSTALLER_CERT" ]; then
            echo "Signing PKG with: $INSTALLER_CERT"
            productbuild --component "macos-app/DiskRaptor-${ver}-macos.app" /Applications \
              --sign "$INSTALLER_CERT" --identifier diskraptor --version "$ver" "$PKG"
          else
            echo "WARNING: no 'Developer ID Installer' cert found â€” building unsigned pkg"
            productbuild --component "macos-app/DiskRaptor-${ver}-macos.app" /Applications \
              --identifier diskraptor --version "$ver" "$PKG"
          fi
          ls -la release-assets
      # Notarization requires a "Developer ID Application" certificate. The current
      # MAS cert may be rejected; continue-on-error ships the signed DMG regardless.
      - name: Notarize and staple
        continue-on-error: true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          dmg="release-assets/DiskRaptor-${ver}-macos-universal.dmg"
          pkg="release-assets/DiskRaptor-${ver}-macos-universal.pkg"
          app="macos-app/DiskRaptor-${ver}-macos.app"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler staple "$pkg"
          xcrun stapler staple "$app"
          xcrun stapler validate "$dmg" "$pkg" "$app"
      - name: Deploy to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if [[ "$tag" != v* ]]; then tag="v$(node -p "require('./package.json').version")"; fi
          gh release create "$tag" --title "DiskRaptor $tag" --generate-notes 2>/dev/null || true
          gh release upload "$tag" "release-assets/*" --clobber
          gh release view "$tag" --json assets --jq '[.assets[] | {name, size}]'

  # Mac App Store build: signed universal .pkg, uploaded to App Store Connect
  # (TestFlight / App Review). Best-effort â€” if the Apple cert/profile/API-key
  # secrets aren't configured the job is skipped, never blocking the release.
  macos-mas:
    name: macOS App Store (MAS PKG + upload)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: Add macOS universal targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # Upload to Apple only once per version. Re-pushing an existing tag (e.g.
      # to ship a build fix) must NOT submit the same version to App Store
      # Connect again â€” unless it was never uploaded (no marker on the release).
      - name: Check if version was already uploaded to Apple
        id: version_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1 && \
             gh release view "$tag" --json assets --jq '[.assets[].name] | any(. == ".apple-uploaded")' 2>/dev/null | grep -q true; then
            echo "Version $tag already uploaded to App Store Connect â€” skipping"
            echo "SKIP_MAS=true" >> "$GITHUB_ENV"
          else
            echo "Version $tag not yet uploaded to Apple â€” MAS upload will run"
          fi
      - name: Build MAS app (store feature, universal)
        if: env.SKIP_MAS != 'true'
        run: npx tauri build --bundles app --ci --features store --target universal-apple-darwin
      - name: Setup code signing keychain
        if: env.SKIP_MAS != 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
            echo "SKIP: MACOS_CERT_P12/MACOS_CERT_PASSWORD not configured"; exit 0
          fi
          echo "$MACOS_CERT_P12" | base64 --decode > /tmp/mas_certs.p12
          security create-keychain -p ci /tmp/mas-ci.keychain
          security default-keychain -s /tmp/mas-ci.keychain
          security unlock-keychain -p ci /tmp/mas-ci.keychain
          security set-keychain-settings -t 3600 /tmp/mas-ci.keychain
          security import /tmp/mas_certs.p12 -P "$MACOS_CERT_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k ci /tmp/mas-ci.keychain
          security list-keychains -d user -s /tmp/mas-ci.keychain
          rm -f /tmp/mas_certs.p12
          security find-identity -v -p codesigning /tmp/mas-ci.keychain
      - name: Prepare MAS bundle (entitlements + provisioning profile)
        if: env.SKIP_MAS != 'true'
        env:
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/DiskRaptor.app"
          [ -d "$APP" ] || { echo "App bundle not found: $APP"; exit 1; }
          ver=$(node -p "require('./package.json').version")
          APP_DST="dist-mas/DiskRaptor.app"
          mkdir -p dist-mas
          cp -R "$APP" "$APP_DST"
          plutil -replace CFBundleIdentifier -string "$BUNDLE_ID" "$APP_DST/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$ver" "$APP_DST/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$ver" "$APP_DST/Contents/Info.plist"
          # Tell the frontend this is a store build so it hides the self-update UI.
          INDEX_HTML=""
          for cand in "$APP_DST/Contents/Resources/_up_/frontend/index.html" "$APP_DST/Contents/Resources/frontend/index.html"; do
            if [ -f "$cand" ]; then INDEX_HTML="$cand"; break; fi
          done
          if [ -n "$INDEX_HTML" ]; then
            perl -pi -e 's/(id="about-update-check")/$1 data-store="true"/' "$INDEX_HTML"
          fi
          if [ -n "$MAS_PROVISIONING_PROFILE" ]; then
            echo "$MAS_PROVISIONING_PROFILE" | base64 --decode > "$APP_DST/Contents/embedded.provisionprofile"
          else
            echo "WARNING: MAS_PROVISIONING_PROFILE not set - App Review may reject"
          fi
      - name: Codesign MAS app
        if: env.SKIP_MAS != 'true'
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          APP_DST="dist-mas/DiskRaptor.app"
          # Prefer the "3rd Party Mac Developer Application" identity from the
          # imported keychain (mirrors sign-and-upload.sh); SIGNING_IDENTITY is
          # an override for the Developer ID / Distribution cert.
          MAS_IDENTITY="${SIGNING_IDENTITY:-}"
          if [ -z "$MAS_IDENTITY" ]; then
            MAS_IDENTITY="$(security find-identity -v -p codesigning 2>/dev/null | grep -i '3rd Party Mac Developer Application' | head -1 | sed 's/.*"\([^"]*\)".*/\1/' || true)"
          fi
          if [ -z "$MAS_IDENTITY" ]; then
            echo "SKIP: no Mac App Store signing identity found (set SIGNING_IDENTITY secret or add certs to MACOS_CERT_P12)"
            exit 0
          fi
          echo "MAS identity: $MAS_IDENTITY"
          xattr -cr "$APP_DST" || true
          find "$APP_DST/Contents" -type f -name "*.dylib" -print0 | \
            xargs -0 -P4 -I{} codesign --force --options=runtime --sign "$MAS_IDENTITY" "{}" || true
          find "$APP_DST/Contents" -type d -name "*.framework" -print0 | \
            xargs -0 -P4 -I{} codesign --force --options=runtime --sign "$MAS_IDENTITY" "{}" || true
          codesign --force --options=runtime --entitlements installer/DiskRaptor-MAS.entitlements \
            --sign "$MAS_IDENTITY" "$APP_DST"
          codesign --verify --deep --strict --verbose=2 "$APP_DST"
      - name: Create MAS PKG
        if: env.SKIP_MAS != 'true'
        env:
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          APP_DST="dist-mas/DiskRaptor.app"
          pkg="dist-mas/DiskRaptor-${ver}-mas.pkg"
          # Detect a "3rd Party Mac Developer Installer" identity for pkg signing.
          INSTALLER_CERT="$(security find-identity -v -p basic 2>/dev/null | grep -i "3rd Party Mac Developer Installer\|Mac Developer Installer" | head -1 | sed 's/.*"\([^"]*\)".*/\1/' || true)"
          if [ -n "$INSTALLER_CERT" ]; then
            productbuild --component "$APP_DST" /Applications \
              --sign "$INSTALLER_CERT" \
              --identifier "$BUNDLE_ID" --version "$ver" "$pkg"
          else
            echo "WARNING: no installer cert found, building unsigned pkg"
            productbuild --component "$APP_DST" /Applications \
              --identifier "$BUNDLE_ID" --version "$ver" "$pkg"
          fi
          ls -lh "$pkg"
      - name: Upload to App Store Connect
        if: env.SKIP_MAS != 'true'
        continue-on-error: true
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "SKIP upload: App Store Connect API key secrets not configured (APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_P8)"
            exit 0
          fi
          ver=$(node -p "require('./package.json').version")
          pkg="dist-mas/DiskRaptor-${ver}-mas.pkg"
          [ -f "$pkg" ] || { echo "PKG not found: $pkg"; exit 1; }
          mkdir -p "$HOME/private_keys"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$HOME/private_keys/AuthKey_$APPLE_API_KEY.p8"
          xcrun altool --upload-app \
            -f "$pkg" -t osx \
            --apiKey "$APPLE_API_KEY" \
            --apiIssuer "$APPLE_API_ISSUER" \
            --output-format json
          echo "Upload submitted. Check status in App Store Connect -> TestFlight."
          # Mark this version as uploaded so later re-runs of the same tag skip it.
          tag="${{ github.ref_name }}"
          echo "uploaded" | gh release upload "$tag" .apple-uploaded --clobber || true

  linux-universal:
    name: Linux (AppImage + DEB + RPM)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev pkg-config libfuse2 rpm
      - name: Build Tauri bundles (AppImage = universal, DEB, RPM)
        run: npx tauri build --bundles deb,rpm,appimage --ci
      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          # Tauri writes the binary architecture into the bundle names; keep
          # that, but prefix a stable "DiskRaptor-<version>" so all three
          # platform jobs use a consistent naming scheme.
          for deb in src-tauri/target/release/bundle/deb/*.deb; do
            [ -f "$deb" ] || continue
            cp "$deb" "release-assets/DiskRaptor-${ver}-$(basename "$deb")"
          done
          for rpm in src-tauri/target/release/bundle/rpm/*.rpm; do
            [ -f "$rpm" ] || continue
            cp "$rpm" "release-assets/DiskRaptor-${ver}-$(basename "$rpm")"
          done
          for appimage in src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -f "$appimage" ] || continue
            cp "$appimage" "release-assets/DiskRaptor-${ver}-$(basename "$appimage")"
          done
          cp src-tauri/target/release/diskraptor "release-assets/DiskRaptor-${ver}-linux-x86_64.bin" 2>/dev/null || true
          echo "=== Staged assets ==="
          ls -la release-assets
          if ! compgen -G "release-assets/*.AppImage" > /dev/null; then
            echo "ERROR: no AppImage produced" >&2
            exit 1
          fi
      - name: Deploy to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if [[ "$tag" != v* ]]; then tag="v$(node -p "require('./package.json').version")"; fi
          gh release create "$tag" --title "DiskRaptor $tag" --generate-notes 2>/dev/null || true
          gh release upload "$tag" "release-assets/*" --clobber
          gh release view "$tag" --json assets --jq '[.assets[] | {name, size}]'

  checksums:
    name: Publish SHA-256 checksums
    runs-on: ubuntu-latest
    needs: [windows-x64, macos-universal, linux-universal]
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets and generate checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if [[ "$tag" != v* ]]; then tag="v$(node -p "require('./package.json').version")"; fi
          mkdir -p checksum-assets
          gh release download "$tag" --dir checksum-assets
          cd checksum-assets
          # Checksum every file (skip the checksum file itself).
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          gh release upload "$tag" checksum-assets/SHA256SUMS.txt --clobber
          echo "SHA256SUMS.txt published for $tag"
