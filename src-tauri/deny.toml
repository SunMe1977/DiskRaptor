[graph]
# Workspace root: src-tauri/Cargo.toml
all-features = true

[advisories]
# Yanked crates fail the build. Unmaintained/unsound advisories on transitive
# Tauri/GTK dependencies have no safe upgrade path, so they are not treated as
# errors (they still show up in the report).
yanked = "deny"
unmaintained = "none"
unsound = "none"

[licenses]
# Anything not in this allowlist (or not an OSI/FSF approved free license)
# fails the check, so an unexpected license can never slip in silently.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
