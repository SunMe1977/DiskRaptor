[package]
name = "diskraptor"
version = "1.0.19"
description = "Ultra-fast disk space analyzer"
authors = ["DiskRaptor Team"]
license = "MIT"
edition = "2021"

[lib]
name = "diskraptor_scanner"
crate-type = ["cdylib", "lib"]

[features]
default = []
test-server = ["tokio-tungstenite", "futures-util", "http"]
# Store builds (Microsoft Store / Apple MAS) disable features that require
# admin elevation or external helpers, which those platforms forbid.
store = []
# Legacy C FFI surface for the old Qt app. Not used by the Tauri app itself;
# kept behind a feature so it is excluded from normal builds.
ffi = []

[[bin]]
name = "diskraptor"
path = "src/main.rs"

[[example]]
name = "dll_test"
required-features = ["ffi"]

[[example]]
name = "scanner_test"
required-features = ["ffi"]

[[example]]
name = "gen_testdata"
required-features = ["ffi"]

[[example]]
name = "clean_testdata"
required-features = ["ffi"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "webview-data-url"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
jwalk = "0.9"
parking_lot = "0.12"
rayon = "1"
anyhow = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
dirs = "6"
sysinfo = "0.39"
trash = "5"
open = "5"
ureq = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", optional = true }
futures-util = { version = "0.3", optional = true }
http = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.39", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_System_IO", "Win32_System_Com"] }

[dev-dependencies]
libloading = "0.8"

# Smaller, faster release binary. Note: panic=abort is intentionally NOT used
# because the scanner relies on catch_unwind to fall back to walkdir.
[profile.release]
lto = true
codegen-units = 1
strip = true
