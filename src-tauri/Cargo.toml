[package]
name = "diskraptor"
version = "1.0.7"
description = "Ultra-fast disk space analyzer"
authors = ["DiskRaptor Team"]
edition = "2021"

[lib]
name = "diskraptor_scanner"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "diskraptor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "webview-data-url"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
jwalk = "0.8"
rayon = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
anyhow = "1"
num_cpus = "1"
log = "0.4"
base64 = "0.22"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
dirs = "5"
sysinfo = "0.33"
trash = "5"
open = "5"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
http = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.39", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Graphics_Gdi"] }
